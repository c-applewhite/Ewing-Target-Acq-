<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Acquisition Target Finder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=12">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/" data-run-context>
        <span class="brand-mark">EOS</span> Acquisition Target Finder
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/" data-nav="dashboard" data-run-context>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/search-runs" data-nav="search-runs">Search Runs</a></li>
          <li class="nav-item"><a class="nav-link" href="/results" data-nav="results" data-run-context>Results</a></li>
          <li class="nav-item"><a class="nav-link" href="/review" data-nav="review" data-run-context>Review</a></li>
          <li class="nav-item"><a class="nav-link" href="/master-list" data-nav="master-list">Master List</a></li>
          <li class="nav-item"><a class="nav-link" href="/config" data-nav="config">Configuration</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-fluid py-4 px-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer text-center py-3 text-muted small">
    Ewing Outdoor Supply &middot; Acquisition Target Finder MVP
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=12"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
